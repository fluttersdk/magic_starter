name: magic_starter
description: Starter kit for Magic Framework. Auth, Profile, Teams, Notifications — 14 opt-in features with overridable views.
version: 0.0.1-alpha.24
homepage: https://magic.fluttersdk.com/starter
documentation: https://magic.fluttersdk.com/packages/starter/getting-started/installation
repository: https://github.com/fluttersdk/magic_starter
issue_tracker: https://github.com/fluttersdk/magic_starter/issues

topics:
  - authentication
  - starter-kit
  - magic
  - flutter
  - admin-panel

# Inherited from `magic`, not chosen here: magic 0.0.6 declares
# `sdk: ">=3.11.0 <4.0.0"` and `flutter: ">=3.41.0"`, and a package cannot
# resolve below its own dependency's floor. The older block this package
# declared was already unsatisfiable for an adopter who took it at its word.
environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  magic: ^0.0.6
  fluttersdk_artisan: ^0.0.9
  # This is a FLOOR for an API, not an upper-bound fix, and the API is
  # `Notify.view`: the notification screens, the bell dropdown and the
  # preferences controller live in that package now, and this package's routes
  # resolve them through that registry. Nothing on pub.dev carries it yet
  # (latest is 0.0.3); the release that first does is 0.1.0.
  #
  # The floor that has to end up on the line below is therefore `^0.1.0`, and it
  # is deliberately not written yet: naming a version pub.dev does not have
  # would leave this package unresolvable for every adopter. It moves in the
  # release commit, beside the version bump, once magic_notifications 0.1.0 is
  # live. Until then the value below names 0.0.4, which was never published, and
  # that is the only thing about this line that is a placeholder rather than a
  # decision. `^0.0.4` does not admit 0.1.0 either (see the caret rule below),
  # so the move is required, not cosmetic.
  #
  # Why a floor is needed at all rather than leaving the caret to it: a caret on
  # a `0.0.x` is `>=0.0.x <0.1.0`, because pub_semver raises the MINOR whenever
  # the major is zero, so `^0.0.2` equally admits 0.0.3, which has no
  # `Notify.view` at all, and a solver could hand this package a version its own
  # routes cannot compile against. `^0.1.0` is `>=0.1.0 <0.2.0` by that same
  # rule and admits nothing below the release that carries the API.
  magic_notifications: ^0.0.4
  # Published, and carrying what the billing screen needs: magic_payments 0.0.2
  # is on pub.dev and ships both `BillingCycle` and `PlanStatus.isDunning`. This
  # comment used to say the package had no release at all and that those two
  # symbols existed only on its default branch, which was true when it was
  # written and is not now.
  #
  # `^0.0.1` is `>=0.0.1 <0.1.0`: pub_semver's `Version.nextBreaking` raises the
  # MINOR whenever the major is zero, whatever the minor itself is
  # (`version.dart:243`), so a caret on any `0.0.x` tracks the whole `0.0.x`
  # line rather than pinning one patch, and this constraint therefore already
  # resolves to 0.0.2. Do not restate that rule as "the first non-zero
  # component": for `0.0.1` that is the patch, which yields `<0.0.2` and is the
  # wrong bound this paragraph exists to correct.
  #
  # So the release order this line used to block on is closed. What is left is
  # the same order one dependency up: magic_notifications has to be on pub.dev
  # carrying `Notify.view` before this package can publish. The `Published
  # graph` CI job is the thing that says so out loud, by resolving the graph a
  # third party actually gets rather than the local path overrides; it reports
  # without blocking.
  magic_payments: ^0.0.1
  args: ^2.7.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/stubs/install/
