name: magic_starter
description: Starter kit for Magic Framework. Auth, Profile, Teams, Notifications — 13 opt-in features with overridable views.
version: 0.0.1-alpha.20
homepage: https://magic.fluttersdk.com/starter
documentation: https://magic.fluttersdk.com/packages/starter/getting-started/installation
repository: https://github.com/fluttersdk/magic_starter
issue_tracker: https://github.com/fluttersdk/magic_starter/issues

topics:
  - authentication
  - starter-kit
  - magic
  - flutter
  - admin-panel

# Inherited from `magic`, not chosen here: magic 0.0.6 declares
# `sdk: ">=3.11.0 <4.0.0"` and `flutter: ">=3.41.0"`, and a package cannot
# resolve below its own dependency's floor. The older block this package
# declared was already unsatisfiable for an adopter who took it at its word.
environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  magic: ^0.0.6
  fluttersdk_artisan: ^0.0.9
  magic_notifications: ^0.0.2
  # Unpublished, so this constraint cannot be bumped to name what the billing
  # screen needs: `BillingCycle` and `PlanStatus.isDunning` both arrived after
  # the pubspec said `^0.0.1`, and there is no released version between them to
  # point at. `^0.0.1` is `>=0.0.1 <0.0.2`, and the 0.0.1 that eventually
  # publishes carries both, because it publishes from a default branch that has
  # them. What that leaves is a RELEASE ORDER rather than a constraint:
  # magic_payments 0.0.1 must be on pub.dev, carrying both, before this package
  # can publish at all. CI says so out loud in the `Published graph` job instead
  # of resolving green against a graph no adopter can install.
  magic_payments: ^0.0.1
  args: ^2.7.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/stubs/install/
