name: magic_starter
description: Starter kit for Magic Framework. Auth, Profile, Teams, Notifications — 14 opt-in features with overridable views.
version: 0.0.40
homepage: https://magic.fluttersdk.com/starter
documentation: https://magic.fluttersdk.com/packages/starter/getting-started/installation
repository: https://github.com/fluttersdk/magic_starter
issue_tracker: https://github.com/fluttersdk/magic_starter/issues

topics:
  - authentication
  - starter-kit
  - magic
  - flutter
  - admin-panel

# Inherited from `magic`, not chosen here: magic 0.0.6 declares
# `sdk: ">=3.11.0 <4.0.0"` and `flutter: ">=3.41.0"`, and a package cannot
# resolve below its own dependency's floor. The older block this package
# declared was already unsatisfiable for an adopter who took it at its word.
environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  # `RouteDefinition.stacked()` is the API this floor names, and it exists in no
  # release below 0.0.12: `git show 0.0.11:lib/src/routing/route_definition.dart`
  # has no `stacked` at all. Eleven routes here call it. A caret on a zero major
  # spans the whole 0.0.x line, so leaving the floor at `^0.0.6` lets pub resolve
  # an adopter onto 0.0.11 and hand them `The method 'stacked' isn't defined`
  # inside a package they do not own, rather than a version-solve message naming
  # magic. `SessionScope`, `SessionScoped`, the keyed `LatestRead` and
  # `BaseGuard.cacheUser`, which the team switch and the billing reads call,
  # first ship in 0.0.22, and the restore listener reads `AuthRestored.changed`,
  # which first ships in 0.0.24. The floor itself names 0.0.27, the release the
  # 2026-10-09 batch verified this package against.
  magic: ^0.0.27
  fluttersdk_artisan: ^0.0.19
  # This is a FLOOR for an API, not an upper-bound fix, and the API is
  # `Notify.view`: the notification screens, the bell dropdown and the
  # preferences controller live in that package now, and this package's routes
  # resolve them through that registry. The release that first carries it is
  # 0.1.0.
  #
  # The floor only ever names a version pub.dev already has: name one it does
  # not and this package is unresolvable for every adopter. It has moved three
  # times now, and the third move is the first one that is not about whether
  # this package compiles.
  #
  # 0.2.0 was about compiling. `NotificationsListView.onDelete` became
  # `Future<bool>` there, and `_confirmThenDelete` in
  # `lib/src/routes/notification_routes.dart` returns one. Against 0.1.0 the
  # library still builds, since `Future<bool>` satisfies a `Future<void>`
  # parameter, but the routes test does not: it reads `onDelete`'s return type.
  #
  # 0.3.0 is about being REACHABLE. A caret raises the MINOR whenever the major
  # is zero, so `^0.2.0` is `>=0.2.0 <0.3.0` and `^0.0.2` equally admits 0.0.3,
  # which has no `Notify.view` at all. The consequence of leaving the floor at
  # `^0.2.0` is not that this package declines 0.3.0 for itself; it is that pub
  # finds no intersection with an app asking for 0.3.0 and walks magic_starter
  # BACKWARDS to an older release rather than failing, so an adopter upgrading
  # magic_notifications loses starter releases with an exit code of zero and
  # nothing said. 0.3.0 also adds the bulk preferences card, whose two
  # translation keys ship in this package's install stub.
  #
  # At least ^0.3.2, rather than ^0.3.0, because `notification_routes.dart` passes
  # `contentClassName`, which 0.3.2 adds. A caret spans the whole 0.3.x line, so
  # leaving the floor lower does not merely make CI red until that release: it
  # lets pub resolve an adopter onto 0.3.0 or 0.3.1 and hand them a COMPILE
  # error at `notification_routes.dart` instead of a version-solve message
  # naming the package. Raising it is the difference between a readable refusal
  # and a broken build. `Notify.pushState`, which the provider registers as a
  # before-logout hook, first ships in 0.3.5. The floor itself names 0.3.8, the
  # release the 2026-10-09 batch verified this package against.
  magic_notifications: ^0.3.8
  # Direct rather than transitive, and this is the point of declaring it:
  # `fluttersdk_wind` reaches this package through `magic`, so without an entry
  # here there is no floor to raise when this package starts calling a new Wind
  # API. `magic_starter_timezone_select.dart` passes `WSelect.onOpen`, which
  # 1.6.0 adds: a new public parameter is a minor rather than the patch this
  # comment predicted before the release existed. An adopter whose
  # `pubspec.lock` already pins 1.5.3 and upgrades this package would otherwise
  # get `undefined_named_parameter` inside a package they do not own, with
  # nothing saying why; with the floor they get a version-solve message naming
  # wind. The floor itself names 1.8.1, the release the 2026-10-09 batch
  # verified this package against.
  fluttersdk_wind: ^1.8.1
  # Published, and carrying what the billing screen needs: magic_payments 0.0.2
  # is on pub.dev and ships both `BillingCycle` and `PlanStatus.isDunning`. This
  # comment used to say the package had no release at all and that those two
  # symbols existed only on its default branch, which was true when it was
  # written and is not now.
  #
  # `^0.0.1` is `>=0.0.1 <0.1.0`: pub_semver's `Version.nextBreaking` raises the
  # MINOR whenever the major is zero, whatever the minor itself is
  # (`version.dart:243`), so a caret on any `0.0.x` tracks the whole `0.0.x`
  # line rather than pinning one patch, and this constraint therefore already
  # resolves to 0.0.2. Do not restate that rule as "the first non-zero
  # component": for `0.0.1` that is the patch, which yields `<0.0.2` and is the
  # wrong bound this paragraph exists to correct.
  #
  # So the release order this line used to block on is closed, and so is the one
  # a dependency up: magic_notifications 0.1.0 is published and carries
  # `Notify.view`, `hasOverride` and `forgetView`. The `Published graph` CI job
  # is what says so out loud, by resolving the graph a third party actually gets
  # rather than the local path overrides. `StoreIdentitySync`, which
  # `switchTeam` re-identifies the store rail through, first ships in 0.0.5.
  # The floor names 0.0.8 because the billing screen purchases by catalogue
  # product key on both rails (`checkout(productKey:)`,
  # `purchase(productKey, context:)`) and reads `PurchaseContext` and
  # `StoreBillingService.lastChangeTiming`, which first ship there; below it
  # this package does not compile. 0.0.9 is where `introEligible` first ships,
  # which the trial copy on the billing screen depends on.
  magic_payments: ^0.0.9
  args: ^2.7.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/stubs/install/
